# quick — smoke test: a ~2 s frame slice with the same efficient settings as `full`.
# Same pipeline as full, just a short window — use it to validate setup fast. Runs
# on any machine. For all frames use `full`; to inspect overlays/viz use `debug`.
global:
  version: 1.0
  description: 'Smoke test: a ~2 s frame slice with the same efficient settings as full.'
  username: ''
  out_dir: output
  jobs_log_dir: output/logs/jobs
  bind: []
  conda_env: mamma
  start_frame: 60
  end_frame: 120
ma_cap:
  engine: conda
  enabled: true
  dependencies: []
  script: run_ma_cap.py
  repo_path: capture
  flags: []
ma_masks:
  engine: conda
  enabled: true
  dependencies:
  - ma_cap
  script: run_ma_masks.py
  repo_path: segmentation
  flags:
  - --sam_version sam2
  - --skip_masked_outputs
  - --lazy-frames
  undistort: false
ma_2d:
  engine: conda
  enabled: true
  dependencies:
  - ma_masks
  script: run_ma_2d.py
  repo_path: landmarks
  config_path: configs/train/models_2d/config_mammanet_mask_512.yaml
  weights: data/weights/ma_2d/mamma_mask_full_cvpr.ckpt
  flags: []
  undistort: false
ma_3d:
  engine: conda
  enabled: true
  dependencies:
  - ma_2d
  script: run_ma_3d.py
  repo_path: optimization
  config_file: config_files/contact_configs/config_real_gmf_small_vals_detr_exp_no_vtemplate.yaml
  flags: []
ma_vis:
  engine: conda
  enabled: true
  dependencies:
  - ma_2d
  - ma_3d
  script: run_ma_vis.py
  repo_path: visualization
  # Parallelize per-camera overlay rendering (measured ~2x on 6 cams). The script
  # default is 1 (serial) to stay safe where parallel pyrender/EGL is finicky;
  # lower this if a host struggles with concurrent offscreen rendering.
  flags: ["--overlay-num-workers 4"]
  undistort: false
