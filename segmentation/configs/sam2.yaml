# SAM2 configuration: recommended for most use cases (default for --sam_version sam2).
#
# SAM2 tracks each object independently and is robust on dense multi-person
# scenes.
#
# Usage:
#   python run_ma_masks.py --sam_version sam2 --assignment_cfg configs/sam2.yaml ...

# ─── Scene ────────────────────────────────────────────────────────────────────

scene:
  # Fixed number of people in the scene. null = auto-detect from the person
  # detector on the init frame. Set explicitly if it misses people or over-detects.
  expected_subjects: null

  # Whether to look at other cameras before processing them, to build a richer
  # per-person CLIP feature bank. Improves cross-camera ID matching accuracy
  # at the cost of extra detector+CLIP inference on the init frame of each camera.
  bootstrap_multiview_bank: true

# ─── Matching ─────────────────────────────────────────────────────────────────
# Controls how people are detected and matched across cameras and frames.

matching:
  # First frame of two candidate searches, which skip the early frames (often
  # dark, or people still entering the scene):
  # - legacy match_then_track: detector+CLIP matching samples start here
  # - sam3_prompt: prompt-frame candidates start here
  # Init-frame auto-selection and the track_then_match seed search sample the
  # whole clip and ignore it. Every frame still gets masks (propagation runs
  # forward and backward).
  start_frame: 10

  # Sample every Nth frame for cross-camera matching (detector+CLIP; legacy
  # match_then_track only). Auto-scales with sequence length. Lower = more thorough but slower. At 30fps video,
  # 50 means roughly one sample every 1.7 seconds.
  sample_interval: 50

  # Minimum number of sampled frames regardless of sequence length. Prevents
  # very short sequences from having too few detection candidates.
  min_samples: 5

  # Person box detector (sam2 / sam3): null or dfine = D-FINE-X (Apache-2.0,
  # downloaded on first use), yolo = Ultralytics (AGPL-3.0, needs `pip install
  # ultralytics` and a .pt checkpoint), or package.module:Class for your own.
  # --detector / --detector-checkpoint override these.
  detector: null
  detector_checkpoint: null

  # Person detection confidence, on the YOLO12x scale (each detector maps it to
  # its own scores). Lower catches more people
  # (useful for occlusion/unusual poses) but may produce false positives.
  # The CLIP matching downstream filters out most false positives.
  yolo_person_conf: 0.5

  # Post-detection deduplication: if two person boxes for the same frame overlap
  # by more than yolo_dedup_iou, the lower-confidence one is dropped. Prevents
  # SAM from receiving two prompts for the same person.
  yolo_dedup_enable: true
  yolo_dedup_iou: 0.75

  # Frame offsets (relative to init frame) used during multi-view bootstrapping.
  # [0] means only the init frame is used. [0, 5, -5] would also check 5 frames
  # before/after. More offsets = better matching but slower bootstrap.
  bootstrap_frame_offsets: [0]

  # Minimum CLIP similarity score for a detection to be accepted during
  # multi-view bootstrap. Lower = more permissive.
  bootstrap_min_score: 0.25

  # Maximum number of CLIP feature vectors stored per person in the feature bank.
  # Larger banks give more robust matching but use more memory.
  feature_bank_max_size: 64

  # During cross-camera matching, a detection must score above this threshold
  # to update the person's feature bank. Prevents low-quality matches from
  # polluting the bank.
  online_bank_update_min_score: 0.35

  # Minimum mask area as a fraction of the image area. sam3_prompt ignores
  # smaller masks when it picks its prompt frame, and the track_then_match remap
  # gives appearance crops from masks near this size less weight. It does not
  # discard tracks (that is tiny_tracklet_* under masks).
  min_mask_area_ratio: 0.01

  # Down-weight seed/prompt frames near the clip boundaries (an endpoint seed
  # doubles the worst-case propagation distance). Length-scaled: full effect
  # from ~3000 frames, inert at <=1000, so short clips are untouched.
  seed_center_bias: 0.5

  # ── Multi-frame anchors (legacy cross-camera strategy only) ──────────────
  # Anchor prompts used when cross_camera_strategy resolves to match_then_track
  # (the no-calibration fallback): non-init cameras are seeded from anchor
  # detections matched to the init ids. The default track_then_match path does
  # not use anchors, and the init camera always uses a single init-frame
  # prompt per ID (multi-frame init anchors poison identity memory on
  # similar-looking people and were removed).

  # Maximum anchor prompts per person. 0 = auto (computed from sequence length
  # and min_anchor_frame_gap). Set to 1 to disable multi-frame anchors.
  max_anchors_per_id: 0

  # Minimum frame distance between two anchors for the same person. Prevents
  # anchor clustering in a small time window.
  min_anchor_frame_gap: 15

  # Minimum CLIP match score for a detection to qualify as an anchor prompt.
  # Lower = more anchor candidates but potentially worse quality.
  anchor_score_threshold: 0.2

  # If no detection meets anchor_score_threshold for a person, fall back to
  # the single best detection regardless of score.
  anchor_fallback_to_best_any: true

  # Upper bound on auto-computed anchors per person. Prevents excessive prompts
  # on very long sequences.
  anchor_auto_max_cap: 32

  # Number of candidate frames evaluated per anchor slot. Higher = better anchor
  # selection but more detector+CLIP work.
  anchor_samples_per_anchor: 6

  # Prevent two different people from using heavily-overlapping anchor boxes on
  # the same frame. If two anchors overlap by more than anchor_conflict_iou,
  # the lower-scoring one is reassigned to a different frame.
  anchor_enforce_cross_id_uniqueness: true
  anchor_conflict_iou: 0.65

  # ── Cross-camera scoring ─────────────────────────────────────────────────
  # When matching people from camera A to camera B, each detection gets a
  # combined score = clip_weight * CLIP_similarity + epipolar_weight * epipolar_score.
  # Epipolar scoring uses camera calibration (intrinsics + extrinsics from NPZ)
  # to check geometric consistency. If calibration is unavailable, epipolar
  # weight is ignored and only CLIP is used.

  clip_weight: 0.4
  epipolar_weight: 0.6

  # Epipolar distance parameters. "auto" computes them from image diagonal.
  # sigma_px: Gaussian width for distance-to-score conversion (in pixels).
  # max_epipolar_dist_px: distances beyond this are clamped to score 0.
  epipolar_sigma_px: auto
  max_epipolar_dist_px: auto

  # When set to "auto", these ratios are multiplied by the image diagonal to
  # compute sigma_px and max_epipolar_dist_px.
  epipolar_sigma_diag_ratio: 0.075
  max_epipolar_dist_diag_ratio: 0.18

  # Minimum CLIP similarity for a detection to be considered at all.
  # 0.0 means any CLIP match is accepted (epipolar score still filters).
  clip_min_similarity: 0.0

  # Minimum combined (CLIP + epipolar) score. Detections below this are rejected.
  combined_min_score: 0.2

  # If true, allow some people to have no match in a camera (they won't get
  # masks in that view). If false, the pipeline warns but continues.
  allow_missing_ids: false

# ─── Mask post-processing ─────────────────────────────────────────────────────
# Applied after propagation, before mask export. Works for all SAM versions.

masks:
  # Step 1: Merge near-identical tracklets (same person tracked twice by SAM).
  # Two tracklets are merged when their average mask IoU exceeds the threshold.
  # 0.95 is very conservative: only fires for genuine duplicate tracks.
  merge_duplicate_tracklets: true
  merge_iou_threshold: 0.95

  # Identity-continuity cleanup. The continuity gate drops transient
  # teleport/duplicate mask stretches (bit-identical on clean footage);
  # collapse recovery re-detects a person lost to a tracker takeover and
  # re-seeds only that sub-range, abstaining when the overlap has no
  # takeover-scale boundary jump (genuine full-contact convergence).
  mask_continuity_gate: true
  recover_collapsed_tracklets: true
  # Re-acquisition: after the cleanup, re-track every stretch where a person
  # has no mask but the detector sees someone no mask covers, from a fresh
  # tracker start inside that stretch. Fills empty frames only, never on a
  # person who already has a mask. Not run by sam3_prompt.
  reacquire_lost_people: true

  # Step 2: Discard tracklets whose mask is too small on most frames.
  # A tracklet is discarded if its mask is below tiny_tracklet_min_area_ratio
  # (fraction of image area) on more than (1 - tiny_tracklet_min_frame_ratio)
  # of its frames. E.g., 0.2 = discard if small on >80% of frames.
  discard_tiny_tracklets: true
  tiny_tracklet_min_area_ratio: 0.005
  tiny_tracklet_min_frame_ratio: 0.2

  # Cross-camera identity for non-init cameras (CLI: --cross-camera-strategy):
  #   auto (default): calibration- and backend-aware. track_then_match for
  #     sam3_prompt_light always, and for the detector backends (sam2/sam3) when
  #     epipolar calibration (cam_int/cam_ext) is available. Without calibration
  #     the remap is CLIP-only, which is unreliable on detector crops, so sam2/sam3
  #     fall back to match_then_track.
  #   track_then_match: propagate each camera independently into clean tracklets,
  #     then remap WHOLE tracklets to the init-camera ids (multi-frame,
  #     occlusion-weighted CLIP + epipolar against the init camera and every
  #     camera already completed). Needs calibration for the epipolar term
  #     (else CLIP-only).
  #   match_then_track (legacy): match init ids to anchor detections and seed the
  #     tracker before propagation (commits identity early).
  cross_camera_strategy: auto

  # Identity repair (post-process, core/rig_vote.py; CLI: --rig_vote): after all
  # cameras finish, every calibrated camera labels a voxel grid with its masks
  # and each camera is checked against the vote of the others; whole-camera
  # mislabels, mid-sequence swaps and takeovers are relabeled in the mask
  # entries (masks.zip or loose PNGs), and those cameras' overlays are redrawn.
  # Runs for 2 to 6 subjects with at least 5 cameras with masks. auto (default: on with >= rig_vote_min_cameras
  # calibrated cameras) | false | true.
  rig_vote: auto
  rig_vote_min_cameras: 12

  # Seed selection for track_then_match seeds EVERY detected person on the seed frame
  # and lets the cross-camera remap prune surplus by identity (CLIP + epipolar), instead
  # of pre-trimming to the expected subject count by raw detection confidence, which
  # would drop a partner-occluded real subject in favour of a cleaner-looking outsider.
  # max_seed_tracklets is a generous safety ceiling for bystander-heavy scenes
  # (logged when hit).
  max_seed_tracklets: 20

# ─── SAM propagation ─────────────────────────────────────────────────────────

sam:
  # Propagate masks both forward and backward from anchor frames. Set to true
  # when the init/anchor frame is in the middle of the sequence, so frames
  # before it also get masks. Disable only if you always start from frame 0.
  propagate_reverse: true

  # ── Memory bounding for long / many-camera clips ──────────────────────────
  # SAM loads the whole decoded video at init_state, so VRAM grows with frame
  # count. These knobs cap it; masks are identical (offload only moves tensors).
  offload_video_to_cpu: true       # keep decoded frames on host RAM, stream to GPU (≈free; bounds VRAM)
  offload_state_to_cpu: auto        # per-frame memory bank on host. auto = on past offload_state_min_frames; or true/false
  offload_state_min_frames: 1500    # frame count above which "auto" enables offload_state_to_cpu

  # Lazy frame loading: load frames on demand (a small window in RAM) instead of
  # all N, bounding host RAM on long clips (offload bounds VRAM, not host). Two
  # backends, same flag:
  #   - image / frame-folder input: LRU window, byte-identical, re-reads from disk.
  #   - mp4 input: cv2 chunk streaming (no disk extraction); near-identical to
  #     native decode (edge pixels), with extra wall time from re-decoding.
  # Turn on when a long video would otherwise run out of host RAM; leave off for
  # short clips that already fit. "auto" enables it from lazy_min_frames up
  # (mirrors offload_state_to_cpu: auto), so short clips keep the eager path.
  lazy_frame_loading: auto
  lazy_min_frames: 1500             # frame count above which "auto" enables it
  lazy_frame_window: 8              # window size for the image/frame (LRU) path
  lazy_video_chunk: 64              # mp4 decode buffer, frames (host RAM ~2x chunk; lower on low-RAM machines)

  # Memory-state pruning: drop the per-frame mask-memory SAM no longer attends to
  # (everything outside a window around the current frame and around anchors), so
  # the stored state stays bounded on long clips instead of growing ~linearly.
  # Not byte-identical: the reverse propagation pass can still reach pruned
  # frames, so masks may differ by edge pixels. Off by default. memory_keep_window must be >= the model's
  # attention reach (16).
  prune_memory_state: false
  memory_keep_window: 32

# ─── Export ───────────────────────────────────────────────────────────────────
# After mask generation, optionally convert image sequences to MP4 videos
# and clean up the source images to save disk space.

exports:
  # Render per-person crop-summary + t-SNE + cross-camera debug PNGs. Off by
  # default: these are pure matplotlib debugging aids and cost wall time. The
  # masks, the masks.npy cache, and the img_bbx crops that drive cross-camera
  # matching are produced regardless. Also settable via --debug_crop_summary.
  debug_crop_summary: false

  # Keep full-res frames + masks in masks.npy (~10x larger). Off by default:
  # masks.npy is slimmed to what matching/resume actually need (per-person
  # centroids + crops + CLIP features); the full-res masks remain on disk as the
  # per-frame masks (masks.zip, or loose PNGs with --png). Also settable via
  # --debug_full_masks_npy.
  debug_full_masks_npy: false

  # Convert mask overlay images to MP4 video.
  export_masked_outputs_mp4: true
  masked_outputs_fps: 30.0
  # Delete overlay images after MP4 export.
  remove_masked_outputs_images: true

  # Convert anchor prompt overlay images to MP4.
  export_prompt_overlays_mp4: true
  prompt_overlays_fps: 4.0
  remove_prompt_overlay_images: true

  # Convert CLIP similarity panel images to MP4.
  export_prompt_similarity_mp4: true
  prompt_similarity_fps: 4.0
  remove_prompt_similarity_images: true
